<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CRC Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --paper:#F5F6F2; --card:#FFFFFF;
  --ink:#17201C; --ink-2:#5D6862; --ink-3:#8A938D;
  --rule:#D5D9D0; --rule-2:#E6E9E2;
  --pine:#2C5A4B; --pine-soft:#E4EEE9; --pine-ink:#FFFFFF;
  --mark:#D4E85C; --mark-a:rgba(212,232,92,.55);
  --pane:#1B2420; --pane-ink:#DDE4DA; --pane-dim:#7C8A82;
  --pane-key:#A8D98C; --pane-str:#E0C58A;
  --shadow:0 1px 2px rgba(23,32,28,.05), 0 10px 30px -14px rgba(23,32,28,.2);
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Bricolage Grotesque",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --code-size:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101413; --card:#171D1A;
    --ink:#E6EAE2; --ink-2:#9BA69F; --ink-3:#727E77;
    --rule:#2B332E; --rule-2:#222925;
    --pine:#7BC4A8; --pine-soft:#1D2A25; --pine-ink:#0D1412;
    --mark:#C9DE55; --mark-a:rgba(201,222,85,.22);
    --pane:#080B0A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#101413; --card:#171D1A;
  --ink:#E6EAE2; --ink-2:#9BA69F; --ink-3:#727E77;
  --rule:#2B332E; --rule-2:#222925;
  --pine:#7BC4A8; --pine-soft:#1D2A25; --pine-ink:#0D1412;
  --mark:#C9DE55; --mark-a:rgba(201,222,85,.22);
  --pane:#080B0A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}


*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1340px;margin:0 auto;padding:22px clamp(14px,3vw,36px) 80px}
.bar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:12px;
  border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--pine);font-weight:600}
h1{font-family:var(--f-display);font-weight:800;font-size:27px;margin:2px 0 0;line-height:1;
  letter-spacing:-.022em}
.sub{font-size:12.5px;color:var(--ink-2);margin:5px 0 0}
.zoom{margin-left:auto;display:flex;gap:7px;align-items:center}
.zoom span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3)}
.zbtn{font-family:var(--f-mono);font-size:13px;font-weight:600;width:32px;height:29px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:2px;cursor:pointer}

.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 0}
.tab{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:8px 14px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink-2);border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.tab .k{opacity:.65;margin-right:5px}
.tab.done::after{content:" ●";font-size:8px;color:var(--mark)}

.head2{display:flex;align-items:baseline;gap:10px;margin:22px 0 4px;flex-wrap:wrap}
.head2 .n{font-family:var(--f-mono);font-size:10px;letter-spacing:.15em;color:var(--ink-3)}
.head2 h2{font-family:var(--f-display);font-size:23px;font-weight:800;margin:0;letter-spacing:-.015em}
.lede{color:var(--ink-2);font-size:13.5px;margin:0 0 14px;max-width:84ch}
.lede b{color:var(--ink)}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.q{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:13px 15px 14px;
  box-shadow:var(--shadow)}
.q.ok{border-color:var(--pine);border-width:2px;padding:12px 14px 13px}
.q.no{border-color:#C0603F;border-width:2px;padding:12px 14px 13px}
.qn{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);font-weight:600;margin-bottom:7px;
  display:flex;justify-content:space-between}
.qn .src{color:var(--pine);font-weight:500}
pre.cd{margin:0 0 10px;background:var(--pane);color:var(--pane-ink);border-radius:3px;
  padding:11px 13px;font-family:var(--f-mono);font-size:var(--cs,13px);line-height:1.75;
  white-space:pre;overflow-x:auto}
pre.cd .k{color:var(--pane-key)} pre.cd .s{color:var(--pane-str)} pre.cd .c{color:var(--pane-dim)}

.opts{display:grid;gap:6px}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--rule);border-radius:3px;
  padding:9px 12px;font-size:13.5px;cursor:pointer;background:var(--paper);line-height:1.5}
.opt i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;font-weight:600;width:19px;height:19px;
  border-radius:50%;background:var(--rule-2);color:var(--ink-2);display:grid;place-items:center;flex:0 0 auto;
  margin-top:2px}
.opt:hover{border-color:var(--pine)}
.opt.sel{border-color:var(--ink);border-width:2px;padding:8px 11px}
.opt.sel i{background:var(--ink);color:var(--paper)}
.opt.right{border-color:var(--pine);border-width:2px;background:var(--pine-soft);padding:8px 11px}
.opt.right i{background:var(--pine);color:#fff}
.opt.wrong{opacity:.5;text-decoration:line-through}

.row{display:flex;align-items:center;gap:9px;margin-top:4px}
.row span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);min-width:64px}
.row input{flex:1;min-width:0;font-family:var(--f-body);font-size:14px;padding:8px 11px;
  border:1px solid var(--rule);border-radius:2px;background:var(--paper);color:var(--ink)}
.row input:focus{outline:2px solid var(--pine);outline-offset:-1px}
.five5{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:7px;margin-top:4px}
.five5 label{display:block;font-family:var(--f-mono);font-size:10px;color:var(--ink-3);margin-bottom:3px}
.five5 input{width:100%;font-family:var(--f-body);font-size:14px;padding:7px 9px;border:1px solid var(--rule);
  border-radius:2px;background:var(--paper);color:var(--ink)}

.fb{font-size:12.5px;line-height:1.6;margin-top:9px;padding:9px 11px;border-radius:3px;display:none}
.fb.show{display:block}
.fb.y{background:var(--pine-soft);border-left:3px solid var(--pine)}
.fb.n{background:#F7E9E4;border-left:3px solid #C0603F}
.fb b.t{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:3px;color:var(--ink-2)}

.acts{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule);
  padding:11px 0 12px;margin-top:20px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--f-body);font-size:13.5px;font-weight:600;padding:10px 19px;border-radius:2px;
  cursor:pointer;border:1px solid var(--pine);background:var(--pine);color:var(--pine-ink)}
.btn.g{background:transparent;color:var(--pine)}
.tip{margin-left:auto;font-size:12px;color:var(--ink-3)}

.report{margin-top:18px;background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:16px 18px}
.report h3{font-family:var(--f-display);font-size:18px;margin:0 0 10px;font-weight:800}
.mrow{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:6px}
.mrow b{min-width:170px}
.mbar{flex:1;height:9px;background:var(--rule-2);border-radius:99px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--pine)}
.mrow.weak b{color:#C0603F}
.mrow.weak .mbar i{background:#C0603F}
.note{font-size:12px;color:var(--ink-3);margin-top:11px}
footer{margin-top:30px;padding-top:12px;border-top:1px solid var(--rule);display:flex;
  justify-content:space-between;font-size:11px;color:var(--ink-3)}
</style>
</head>
<body>

<div class="wrap">
<div class="bar">
  <div>
    <div class="eyebrow">Code Reading Comprehension &middot; Day 1</div>
    <h1>Reading Console</h1>
    <p class="sub">종이에 먼저 답을 쓰고 옮겨 적습니다. <b>많이 읽는 것이 전부입니다.</b></p>
  </div>
  <div class="zoom"><span>글자</span>
    <button class="zbtn" id="zo">A&minus;</button><button class="zbtn" id="zi">A+</button></div>
</div>
<div class="tabs" id="tabs"></div>
<div id="pane"></div>
<div class="acts">
  <button class="btn" id="g1">이 유형 채점</button>
  <button class="btn g" id="ga">전체 채점</button>
  <button class="btn g" id="gc">지우기</button>
  <span class="tip" id="tip"></span>
</div>
<div id="report"></div>
<footer><span>파이썬 코드 문해력 키우기</span><span>READING CONSOLE</span></footer>
</div>

    "짝수를 고르고 → 5 미만만 1 씩 키우고 → 합한다",
    "짝수를 1 씩 키워 합한다",
    "0 부터 5 까지 짝수의 개수를 센다"
   ],
   "c": 1,
   "why": "<b>세 덩어리가 줄줄이</b> 이어집니다 &mdash; 걸러내기 → 걸러내며 값 바꾸기 → 누적. <b>한 함수씩 무엇을 내놓는지</b>만 적어 가면 풀립니다. <code>g</code> 안의 <code>i &lt; 5</code> 가 <b>4 를 걸러내지 않는다</b>는 점이 함정입니다."
  }
 ]
};
var META = {"1": ["무엇을 하는가", "코드를 읽고 하는 일을 고릅니다. <b>먼저 스스로 말해 보고</b> 고르세요.", "pick"], "2": ["다섯 곳", "<b>IN · VAR · OUT · LOOP · DEPTH</b>. 다섯 다 숫자로 셉니다. <b>VAR 은 <code>=</code> 왼쪽과 <code>for</code> 뒤에 나오는 서로 다른 이름</b>의 개수예요.", "five"], "3": ["이 덩어리가 하는 일", "한 마디로 씁니다. <b>패턴 이름도, 읽는 법도</b> 정답입니다.", "text"], "4": ["독립된 일이 몇 개", "한 반복 안에 <b>서로 상관없는 일</b>이 몇 가지인지.", "num"], "5": ["else 는 누구의 짝", "줄번호로 답합니다. <b>들여쓰기가 같은 것</b>을 찾으세요.", "num"], "6": ["이름을 지운 판", "<code>f(a, b, c)</code> 뿐입니다. <b>구조만 보고</b> 고릅니다.", "pick"], "7": ["몇 번 도는가", "반복이 <b>몇 번</b> 도는지 숫자로.", "num"], "8": ["종합 — 무엇을 하는가", "1학기 <b>기초 100제</b> 종합 문항입니다. 그땐 <b>출력 결과</b>를 따라갔죠. 이번엔 <b>무엇을 하는 코드인지</b>를 봅니다.", "pick"]};
var ORDER = ["1","2","3","4","5","6","7","8"];
var $ = function(i){ return document.getElementById(i); };
var cur = "1", store = {};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
var KW = /\b(def|for|while|if|elif|else|return|break|continue|in|not|and|or|True|False|None|len|range|print|append)\b/g;
function hl(lines){
  return lines.map(function(l){
    var t = esc(l);
    t = t.replace(/(#.*)$/, '<span class="c">$1</span>');
    t = t.replace(KW, '<span class="k">$1</span>');
    t = t.replace(/('[^']*')/g, '<span class="s">$1</span>');
    return t;
  }).join("\n");
}
function norm(t){
  t = String(t||"").trim().toLowerCase();
  t = t.replace(/[\s·,.\/\-+&()\[\]「」'"]+/g,"");
  t = t.replace(/그리고|하면서|동시에/g,"");
  t = t.replace(/갯수/g,"개수").replace(/최대값/g,"최댓값").replace(/최소값/g,"최솟값");
  return t;
}
function loose(t){
  t = norm(t);
  ["하는코드","하는것","하는거","합니다","한다","해요","임","이다"].forEach(function(s){
    if (t.length > s.length && t.slice(-s.length) === s) t = t.slice(0, -s.length);
  });
  return t;
}
function okText(item, v){
  var set = {};
  item.a.forEach(function(a){ set[norm(a)] = 1; set[loose(a)] = 1; });
  if (item.best){ set[norm(item.best)] = 1; set[loose(item.best)] = 1; }
  if (set[norm(v)] || set[loose(v)]) return true;
  if (item.g){
    var n = norm(v);
    if (!n) return false;
    return item.g.every(function(grp){
      return grp.some(function(k){ return n.indexOf(norm(k)) >= 0; });
    });
  }
  return false;
}

function tabs(){
  var h = "";
  ORDER.forEach(function(t){
    var st = store[t];
    h += '<button class="tab'+(st&&st.graded?" done":"")+'" data-t="'+t+'" aria-selected="'+(t===cur)+'">'+
         '<span class="k">'+t+'</span>'+META[t][0]+'</button>';
  });
  $("tabs").innerHTML = h;
}

function render(){
  var items = BANK[cur], m = META[cur], kind = m[2];
  var h = '<div class="head2"><span class="n">TYPE '+cur+'</span><h2>'+m[0]+'</h2></div>'+
          '<p class="lede">'+m[1]+' &nbsp;<b>'+items.length+'문항</b></p><div class="grid">';
  items.forEach(function(it, i){
    var id = cur+"-"+i;
    h += '<div class="q" id="q'+id+'"><div class="qn"><span>'+it.n+'</span>'+
         (it.src ? '<span class="src">'+it.src+'</span>' : '')+'</div>';
    h += '<pre class="cd">'+hl(it.code)+'</pre>';
    if (kind === "pick"){
      h += '<div class="opts">';
      it.o.forEach(function(o, k){
        h += '<div class="opt" data-i="'+id+'" data-k="'+k+'"><i>'+(k+1)+'</i><span>'+o+'</span></div>';
      });
      h += '</div>';
    } else if (kind === "five"){
      h += '<div class="five5">'+
        ["IN","VAR","OUT","LOOP","DEPTH"].map(function(f){
          return '<div><label>'+f+'</label><input id="in'+id+'-'+f+'" autocomplete="off"></div>';
        }).join("")+'</div>';
    } else {
      var lab = (kind === "num") ? (cur === "5" ? "줄번호" : "숫자") : "한 마디로";
      var pre = (cur === "5" && it.q) ? '<div style="font-size:12.5px;color:var(--ink-2);margin-bottom:6px">'+it.q+' 는 몇 번 줄 <code>if</code> 의 짝인가?</div>' : "";
      h += pre + '<div class="row"><span>'+lab+'</span><input id="in'+id+'" autocomplete="off"></div>';
    }
    h += '<div class="fb" id="fb'+id+'"></div></div>';
  });
  h += '</div>';
  $("pane").innerHTML = h;
  restore();
  $("tip").textContent = "";
  window.scrollTo(0,0);
}

function restore(){
  var st = store[cur]; if (!st) return;
  BANK[cur].forEach(function(it, i){
    var id = cur+"-"+i, v = st.vals[i];
    if (v === undefined || v === null) return;
    var kind = META[cur][2];
    if (kind === "pick"){
      var o = document.querySelector('.opt[data-i="'+id+'"][data-k="'+v+'"]');
      if (o) o.classList.add("sel");
    } else if (kind === "five"){
      ["IN","VAR","OUT","LOOP","DEPTH"].forEach(function(f){
        var e = $("in"+id+"-"+f); if (e && v[f] !== undefined) e.value = v[f];
      });
    } else { var e2 = $("in"+id); if (e2) e2.value = v; }
  });
  if (st.graded) grade(true);
}

function collect(){
  var kind = META[cur][2], vals = [];
  BANK[cur].forEach(function(it, i){
    var id = cur+"-"+i;
    if (kind === "pick"){
      var s = document.querySelector('.opt[data-i="'+id+'"].sel');
      vals.push(s ? +s.dataset.k : null);
    } else if (kind === "five"){
      var o = {};
      ["IN","VAR","OUT","LOOP","DEPTH"].forEach(function(f){
        var e = $("in"+id+"-"+f); o[f] = e ? e.value : "";
      });
      vals.push(o);
    } else { var e2 = $("in"+id); vals.push(e2 ? e2.value : ""); }
  });
  return vals;
}

function judge(t, i, v){
  var it = BANK[t][i], kind = META[t][2];
  if (kind === "pick") return v === it.c;
  if (kind === "five"){
    if (!v) return false;
    return ["IN","VAR","OUT","LOOP","DEPTH"].every(function(f){
      return String(v[f]).replace(/[^0-9]/g,"") === it.a[f];
    });
  }
  if (kind === "text") return okText(it, v);
  return String(v).replace(/[^0-9]/g,"") === String(it.a);
}

function grade(quiet){
  var vals = collect();
  store[cur] = {vals: vals, graded: true};
  var right = 0;
  BANK[cur].forEach(function(it, i){
    var id = cur+"-"+i, ok = judge(cur, i, vals[i]);
    var kind = META[cur][2], v = vals[i];
    var blank = (v === null || v === "" || v === undefined);
    /* 유형 2 는 답이 {IN,VAR,OUT,LOOP,DEPTH} 객체라 다섯 칸이 다 비어도
       객체 자체는 null 도 "" 도 아니다. 그래서 안 푼 문항이 오답으로 찍혔다. */
    if (!blank && kind === "five"){
      blank = ["IN","VAR","OUT","LOOP","DEPTH"].every(function(f){
        return !v[f] || String(v[f]).trim() === "";
      });
    }
    if (ok) right++;
    var box = $("q"+id); box.classList.remove("ok","no");
    if (!blank || ok) box.classList.add(ok ? "ok" : "no");
    if (kind === "pick"){
      document.querySelectorAll('.opt[data-i="'+id+'"]').forEach(function(o){
        o.classList.remove("right","wrong");
        if (+o.dataset.k === it.c) o.classList.add("right");
        else if (o.classList.contains("sel")) o.classList.add("wrong");
      });
    }
    var f = $("fb"+id);
    var ans = "";
    if (kind === "five") ans = "IN "+it.a.IN+" · VAR "+it.a.VAR+" · OUT "+it.a.OUT+" · LOOP "+it.a.LOOP+" · DEPTH "+it.a.DEPTH;
    else if (kind === "text") ans = it.best + '　<span style="color:var(--ink-3)">패턴 이름 — '+it.tag+'</span>';
    else if (kind === "pick") ans = (it.c+1)+"번";
    else ans = it.a + (it.out ? '　<span style="color:var(--ink-3)">출력 — '+it.out+'</span>' : "");
    /* 유형 2 는 넷을 맞혔어도 NAME 모범 한 마디는 늘 보여 준다 — 내가 쓴 것과 대 보라고. */
    var nmLine = (kind === "five" && it.nm)
      ? '<div style="margin-top:5px;padding-top:5px;border-top:1px solid var(--rule)">'+
        (it.vars && it.vars.length
          ? '<b>VAR</b> — <code>'+it.vars.join('</code> <code>')+'</code>　'
          : '<b>VAR</b> — 없음(안에서 새로 만드는 이름이 하나도 없다)　')+
        '<b>한 마디로</b> '+it.nm+'</div>'
      : "";
    f.className = "fb show " + (ok ? "y" : "n");
    f.innerHTML = '<b class="t">'+(ok ? "맞음" : "답")+'</b>'+
                  (ok ? "" : '<div style="margin-bottom:5px"><b>'+ans+'</b></div>') +
                  (it.why || "") + nmLine;
  });
  tabs();
  $("tip").textContent = right + " / " + BANK[cur].length;
  if (!quiet) $("tip").textContent += "  ·  틀린 것만 다시 보세요";
}

function all(){
  var h = '<div class="report"><h3>유형별 정답률</h3>';
  var weak = [];
  ORDER.forEach(function(t){
    var st = store[t];
    var tot = BANK[t].length, got = 0;
    if (st) BANK[t].forEach(function(it,i){ if (judge(t,i,st.vals[i])) got++; });
    var pct = Math.round(got/tot*100);
    if (st && pct < 80) weak.push(t);
    h += '<div class="mrow'+(st && pct<80 ? " weak":"")+'"><b>'+t+'. '+META[t][0]+'</b>'+
         '<div class="mbar"><i style="width:'+(st?pct:0)+'%"></i></div>'+
         '<span style="font-family:var(--f-mono);font-size:12px;min-width:52px;text-align:right">'+
         (st ? got+"/"+tot : "—")+'</span></div>';
  });
  h += '<p class="note">'+(weak.length
        ? '<b>80% 아래인 유형 — '+weak.map(function(t){return t+"번";}).join(" · ")+'</b>. 거기부터 다시 읽습니다.'
        : '아직 채점하지 않은 유형이 있거나, 전부 80% 이상입니다.')+
       ' 점수는 기록하지 않습니다.</p></div>';
  $("report").innerHTML = h;
  $("report").scrollIntoView({behavior:"smooth", block:"start"});
}

document.addEventListener("click", function(e){
  var t = e.target.closest(".tab");
  if (t){ store[cur] = {vals: collect(), graded: !!(store[cur]&&store[cur].graded)}; cur = t.dataset.t; tabs(); render(); return; }
  var o = e.target.closest(".opt");
  if (o){
    document.querySelectorAll('.opt[data-i="'+o.dataset.i+'"]').forEach(function(x){ x.classList.remove("sel"); });
    o.classList.add("sel");
  }
});
$("g1").addEventListener("click", function(){ grade(false); });
$("ga").addEventListener("click", function(){ store[cur]={vals:collect(),graded:true}; all(); });
$("gc").addEventListener("click", function(){ store[cur]=null; $("report").innerHTML=""; tabs(); render(); });
document.addEventListener("keydown", function(e){
  if (e.key !== "Enter") return;
  var t = e.target; if (!t || t.tagName !== "INPUT") return;
  e.preventDefault();
  var all2 = Array.prototype.slice.call(document.querySelectorAll("#pane input"));
  var i = all2.indexOf(t);
  if (i > -1 && i < all2.length - 1) all2[i+1].focus(); else $("g1").click();
});
var cs = 13;
function zoom(d){ cs = Math.min(24, Math.max(10, cs+d));
  document.documentElement.style.setProperty("--cs", cs+"px"); }
$("zi").addEventListener("click", function(){ zoom(1.5); });
$("zo").addEventListener("click", function(){ zoom(-1.5); });

tabs(); render();
})();
</script>

</body>
</html>
