<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Data Flow Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --paper:#F5F6F2; --card:#FFFFFF;
  --ink:#17201C; --ink-2:#5D6862; --ink-3:#8A938D;
  --rule:#D5D9D0; --rule-2:#E6E9E2;
  --pine:#2C5A4B; --pine-soft:#E4EEE9; --pine-ink:#FFFFFF;
  --mark:#D4E85C; --mark-a:rgba(212,232,92,.5);
  --warn:#C0603F; --warn-soft:#F7E9E4;
  --pane:#1B2420; --pane-ink:#DDE4DA; --pane-dim:#7C8A82;
  --pane-key:#A8D98C; --pane-str:#E0C58A; --pane-line:#2A3831;
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Bricolage Grotesque",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101413; --card:#171D1A;
    --ink:#E6EAE2; --ink-2:#9BA69F; --ink-3:#727E77;
    --rule:#2B332E; --rule-2:#222925;
    --pine:#7BC4A8; --pine-soft:#1D2A25; --pine-ink:#0D1412;
    --mark:#C9DE55; --mark-a:rgba(201,222,85,.22);
    --warn:#E4917A; --warn-soft:#2C1D18;
    --pane:#080B0A; --pane-line:#1B2420;
  }
}
:root[data-theme="dark"]{
  --paper:#101413; --card:#171D1A;
  --ink:#E6EAE2; --ink-2:#9BA69F; --ink-3:#727E77;
  --rule:#2B332E; --rule-2:#222925;
  --pine:#7BC4A8; --pine-soft:#1D2A25; --pine-ink:#0D1412;
  --mark:#C9DE55; --mark-a:rgba(201,222,85,.22);
  --warn:#E4917A; --warn-soft:#2C1D18;
  --pane:#080B0A; --pane-line:#1B2420;
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:26px 20px 60px}

/* ── 머리 ── */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;
  padding-bottom:13px;border-bottom:2px solid var(--ink)}
.top h1{font-family:var(--f-display);font-size:25px;font-weight:800;letter-spacing:-.02em;margin:0}
.top .sub{font-size:13.5px;color:var(--ink-2);margin:0}
.modes{margin-left:auto;display:flex;gap:0;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.modes button{font-family:var(--f-mono);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  padding:8px 16px;border:0;background:var(--card);color:var(--ink-2);cursor:pointer}
.modes button+button{border-left:1px solid var(--rule)}
.modes button[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink)}
.modes button:focus-visible{outline:2px solid var(--pine);outline-offset:-2px}

/* ── 판 ── */
.board{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-top:18px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.phd{display:flex;align-items:baseline;gap:9px;padding:9px 13px;border-bottom:1px solid var(--rule-2)}
.phd b{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.phd span{font-size:12.5px;color:var(--ink-2)}

/* 코드 */
.code{background:var(--pane);padding:11px 0;overflow-x:auto}
.ln{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:1px 13px;
  font-family:var(--f-mono);font-size:13px;line-height:1.72;color:var(--pane-ink);white-space:pre}
.ln i{color:var(--pane-dim);font-style:normal;text-align:right;font-size:11px}
.ln.on{background:var(--pane-line)}
.ln.on i{color:var(--mark)}
.ln em{font-style:normal}
.ln.on{box-shadow:inset 3px 0 0 var(--mark)}
.k{color:var(--pane-key)}
.s{color:var(--pane-str)}
.c{color:var(--pane-dim)}

/* 흐름 */
.flow{padding:11px 13px;border-top:1px solid var(--rule-2);display:grid;gap:7px}
.fnote{font-size:13.5px;color:var(--ink)}
.farr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--f-mono);font-size:13px}
.box{border:1px solid var(--rule);border-radius:3px;padding:3px 9px;background:var(--paper);color:var(--ink-2)}
.box.src{border-color:var(--ink-3)}
.box.dst{border-color:var(--pine);background:var(--pine-soft);color:var(--ink);font-weight:600}
.val{background:var(--mark);color:#17201C;border-radius:2px;padding:1px 6px;font-weight:600}
.farr .to{color:var(--pine);font-size:15px}
.farr.none{color:var(--ink-3)}

/* 그림 */
.figwrap{padding:6px 10px 10px}
svg{display:block;width:100%;height:auto}
.edge{stroke:var(--rule);stroke-width:2;fill:none}
.edge.tree{stroke:var(--pine);stroke-width:3}
.edge.live{stroke:var(--mark);stroke-width:4}
.nd{fill:var(--card);stroke:var(--ink-3);stroke-width:2}
.nd.inq{stroke:var(--pine);stroke-dasharray:4 3;stroke-width:2.5}
.nd.seen{fill:var(--pine-soft);stroke:var(--pine);stroke-width:2.5}
.nd.cur{fill:var(--mark);stroke:var(--ink);stroke-width:3}
.nlab{font-family:var(--f-mono);font-size:15px;font-weight:600;fill:var(--ink);
  text-anchor:middle;dominant-baseline:central}
.nord{font-family:var(--f-mono);font-size:11px;font-weight:600;fill:var(--pine);text-anchor:middle}

/* 상태표 */
.states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.st{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:11px 13px 13px}
.st h3{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 3px;font-weight:600}
.st .why{font-size:12px;color:var(--ink-3);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-height:29px;align-items:flex-start}
.chip{font-family:var(--f-mono);font-size:13px;font-weight:600;padding:3px 10px;border-radius:3px;
  border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.chip.head{border-color:var(--pine);background:var(--pine);color:var(--pine-ink)}
.chip.pair{font-weight:500;color:var(--ink-2)}
.chip.pair b{color:var(--ink)}
.empty{font-size:12.5px;color:var(--ink-3);font-family:var(--f-body)}

/* 조작 */
.bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:16px;
  padding-top:14px;border-top:1px solid var(--rule)}
.btn{font-family:var(--f-body);font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:3px;
  border:1px solid var(--pine);background:var(--pine);color:var(--pine-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--pine)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.toggle{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.toggle input{width:15px;height:15px;accent-color:var(--pine)}
.count{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* 예측 관문 */
.gate{margin-top:16px;border:1px solid var(--pine);border-radius:4px;background:var(--pine-soft);
  padding:14px 16px;display:none}
.gate.on{display:block}
.gate h3{font-size:15px;font-weight:600;margin:0 0 3px}
.gate p{margin:0 0 10px;font-size:13px;color:var(--ink-2)}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{font-family:var(--f-mono);font-size:15px;font-weight:600;padding:8px 18px;border-radius:3px;
  border:1px solid var(--pine);background:var(--card);color:var(--ink);cursor:pointer}
.pick:hover{background:var(--mark-a)}
.pick.no{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.pick:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.gmsg{margin-top:9px;font-size:13px;color:var(--warn);min-height:19px}

.note{margin-top:22px;font-size:13.5px;color:var(--ink-2);
  border-left:3px solid var(--mark);padding:2px 0 2px 13px}
.note b{color:var(--ink)}

@media (max-width:860px){ .board{grid-template-columns:1fr} .states{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div class="wrap">

  <div class="top">
    <div>
      <h1>데이터 흐름 추적기</h1>
      <p class="sub">값이 어디서 나와 어디로 가는가 &mdash; 한 걸음씩</p>
    </div>
    <div class="modes">
      <button id="mBfs" aria-pressed="true">BFS · popleft()</button>
      <button id="mDfs" aria-pressed="false">DFS · pop()</button>
    </div>
  </div>

  <div class="board">
    <div class="panel">
      <div class="phd"><b>코드</b><span id="cdsub">큐의 <b>앞</b>에서 꺼낸다</span></div>
      <div class="code" id="code"></div>
      <div class="flow">
        <div class="fnote" id="fnote">시작하려면 <b>한 걸음</b>을 누르세요.</div>
        <div class="farr none" id="farr">아직 옮겨진 값이 없습니다</div>
      </div>
    </div>

    <div class="panel">
      <div class="phd"><b>그림</b><span>방문한 순서대로 번호가 붙는다</span></div>
      <div class="figwrap">
        <svg viewBox="0 0 360 300" role="img" aria-label="노드 일곱 개짜리 그래프">
          <g id="edges"></g>
          <g id="nodes"></g>
        </svg>
      </div>
    </div>
  </div>

  <div class="states">
    <div class="st">
      <h3>큐 &nbsp;q</h3>
      <p class="why">앞으로 볼 것</p>
      <div class="chips" id="sq"></div>
    </div>
    <div class="st">
      <h3>방문 &nbsp;seen</h3>
      <p class="why">이미 본 것 — 다시 넣지 않는다</p>
      <div class="chips" id="ss"></div>
    </div>
    <div class="st">
      <h3>부모 &nbsp;came</h3>
      <p class="why">어디서 왔는지 기록</p>
      <div class="chips" id="sc"></div>
    </div>
  </div>

  <div class="gate" id="gate">
    <h3>다음에 꺼낼 노드는?</h3>
    <p id="gq">큐를 보고 <b>먼저 맞혀야</b> 다음 걸음이 열립니다.</p>
    <div class="picks" id="picks"></div>
    <div class="gmsg" id="gmsg"></div>
  </div>

  <div class="bar">
    <button class="btn" id="step">한 걸음</button>
    <button class="btn ghost" id="jump">다음 꺼내기까지</button>
    <button class="btn ghost" id="reset">처음부터</button>
    <span class="count" id="count"></span>
    <label class="toggle"><input type="checkbox" id="ask" checked> 꺼내기 전에 예측</label>
  </div>

  <p class="note" id="verdict">같은 코드에서 <b>한 글자만</b> 바꿉니다 &mdash;
  <code>popleft()</code> 를 <code>pop()</code> 으로. 그런데 색이 퍼지는 <b>모양이 달라집니다.</b>
  둘을 번갈아 돌려 보세요.</p>

</div>

<script>
(function(){
  "use strict";

  /* ── 그래프 ── */
  var ADJ = { A:["B","C"], B:["D","E"], C:["F"], D:["G"], E:["G"], F:["G"], G:[] };
  var POS = { A:[180,42], B:[100,112], C:[262,112], D:[56,192], E:[146,192], F:[256,192], G:[180,262] };
  var EDGES = [["A","B"],["A","C"],["B","D"],["B","E"],["C","F"],["D","G"],["E","G"],["F","G"]];
  var START = "A";

  var CODE = [
    ['<span class="k">def</span> search(G, start):', 0],
    ['    q = deque([start])', 1],
    ['    seen = {start}', 2],
    ['    came = {}', 3],
    ['    <span class="k">while</span> q:', 4],
    ['        cur = q.__POP__', 5],
    ['        <span class="k">for</span> nxt <span class="k">in</span> G[cur]:', 6],
    ['            <span class="k">if</span> nxt <span class="k">not</span> <span class="k">in</span> seen:', 7],
    ['                seen.add(nxt)', 8],
    ['                came[nxt] = cur', 9],
    ['                q.append(nxt)', 10],
    ['    <span class="k">return</span> came', 11]
  ];

  /* ── 걸음을 미리 만든다 ── */
  function build(mode){
    var steps = [], q = [START], seen = [START], came = {}, order = [];
    function snap(o){
      o.q = q.slice(); o.seen = seen.slice(); o.order = order.slice();
      o.came = JSON.parse(JSON.stringify(came));
      steps.push(o);
    }
    snap({line:1, note:"시작 노드를 큐에 넣는다.",
          flow:["start", "q", START]});
    snap({line:2, note:"시작 노드를 <b>방문했다고 표시</b>한다. 다시 넣지 않으려고.",
          flow:["start", "seen", START]});
    snap({line:3, note:"부모 기록은 아직 비어 있다.", flow:null});

    while(q.length){
      snap({line:4, note:"큐가 비었나? <b>아니다</b> — 한 바퀴 더 돈다.", flow:null});
      var opts = q.slice();
      var cur  = (mode === "bfs") ? q.shift() : q.pop();
      order.push(cur);
      snap({line:5, cur:cur,
            note:"큐의 <b>" + (mode === "bfs" ? "앞" : "뒤") + "</b>에서 <b>" + cur + "</b> 를 꺼낸다.",
            flow:["q", "cur", cur],
            ask:(opts.length > 1 ? {opts:opts, answer:cur} : null)});

      var nbrs = ADJ[cur];
      for(var i = 0; i < nbrs.length; i++){
        var nxt = nbrs[i];
        snap({line:6, cur:cur, nxt:nxt, live:[cur, nxt],
              note:"<b>" + cur + "</b> 의 이웃 <b>" + nxt + "</b> 을 본다.",
              flow:["G[" + cur + "]", "nxt", nxt]});
        if(seen.indexOf(nxt) < 0){
          snap({line:7, cur:cur, nxt:nxt, live:[cur, nxt],
                note:"<b>" + nxt + "</b> 은 아직 방문 안 함 — <b>관문 통과</b>.", flow:null});
          seen.push(nxt);
          snap({line:8, cur:cur, nxt:nxt, live:[cur, nxt],
                note:"방문했다고 표시한다.", flow:["nxt", "seen", nxt]});
          came[nxt] = cur;
          snap({line:9, cur:cur, nxt:nxt, tree:[cur, nxt],
                note:"<b>" + nxt + "</b> 은 <b>" + cur + "</b> 에서 왔다고 기록한다.",
                flow:["cur", "came[" + nxt + "]", cur]});
          q.push(nxt);
          snap({line:10, cur:cur, nxt:nxt, tree:[cur, nxt],
                note:"큐 <b>뒤에</b> 넣는다. 나중에 볼 것.", flow:["nxt", "q", nxt]});
        } else {
          snap({line:7, cur:cur, nxt:nxt, live:[cur, nxt], skip:true,
                note:"<b>" + nxt + "</b> 은 <b>이미 방문</b> — 건너뛴다.", flow:null});
        }
      }
    }
    snap({line:4, note:"큐가 <b>비었다</b> — 반복이 끝난다.", flow:null});
    snap({line:11, note:"부모 기록을 돌려준다. <b>여기까지가 한 판</b>이다.", flow:null, done:true});
    return steps;
  }

  /* ── 화면 ── */
  var $ = function(i){ return document.getElementById(i); };
  var mode = "bfs", steps = build("bfs"), at = -1, gateOn = null;

  function drawCode(){
    $("code").innerHTML = CODE.map(function(row){
      var t = row[0].replace("__POP__", mode === "bfs" ? "popleft()" : "pop()");
      if(row[1] === 5) t += '   <span class="c"># ' + (mode === "bfs" ? "앞에서" : "뒤에서") + '</span>';
      return '<div class="ln" data-l="' + row[1] + '"><i>' + (row[1] + 1) + '</i><em>' + t + '</em></div>';
    }).join("");
    $("cdsub").innerHTML = "큐의 <b>" + (mode === "bfs" ? "앞" : "뒤") + "</b>에서 꺼낸다";
  }

  function drawFig(){
    var e = "", n = "";
    EDGES.forEach(function(pr, i){
      var a = POS[pr[0]], b = POS[pr[1]];
      e += '<line class="edge" id="e' + i + '" x1="' + a[0] + '" y1="' + a[1] +
           '" x2="' + b[0] + '" y2="' + b[1] + '"></line>';
    });
    Object.keys(POS).forEach(function(k){
      var p = POS[k];
      n += '<g><circle class="nd" id="n' + k + '" cx="' + p[0] + '" cy="' + p[1] + '" r="21"></circle>' +
           '<text class="nlab" x="' + p[0] + '" y="' + p[1] + '">' + k + '</text>' +
           '<text class="nord" id="o' + k + '" x="' + p[0] + '" y="' + (p[1] - 27) + '"></text></g>';
    });
    $("edges").innerHTML = e; $("nodes").innerHTML = n;
  }

  function chips(el, list, headFirst){
    if(!list.length){ el.innerHTML = '<span class="empty">비어 있음</span>'; return; }
    el.innerHTML = list.map(function(x, i){
      return '<span class="chip' + (headFirst && i === 0 ? ' head' : '') + '">' + x + '</span>';
    }).join("");
  }

  function paint(){
    var s = (at < 0) ? {q:[START], seen:[START], came:{}, order:[], line:-1, note:null, flow:null} : steps[at];

    document.querySelectorAll(".ln").forEach(function(el){
      el.classList.toggle("on", parseInt(el.dataset.l, 10) === s.line);
    });

    $("fnote").innerHTML = s.note || "시작하려면 <b>한 걸음</b>을 누르세요.";
    var fa = $("farr");
    if(s.flow){
      fa.className = "farr";
      fa.innerHTML = '<span class="box src">' + s.flow[0] + '</span>' +
                     '<span class="to">──▶</span>' +
                     '<span class="box dst">' + s.flow[1] + '</span>' +
                     '<span class="val">' + s.flow[2] + '</span>';
    } else {
      fa.className = "farr none";
      fa.textContent = s.skip ? "옮겨지는 값이 없다 — 건너뛴다" : "이번 줄은 값을 옮기지 않는다";
    }

    Object.keys(POS).forEach(function(k){
      var c = $("n" + k), o = $("o" + k), cls = "nd";
      if(s.seen.indexOf(k) >= 0) cls += " seen";
      if(s.q.indexOf(k) >= 0) cls += " inq";
      if(s.cur === k) cls += " cur";
      c.setAttribute("class", cls);
      var i = s.order.indexOf(k);
      o.textContent = i >= 0 ? (i + 1) : "";
    });
    EDGES.forEach(function(pr, i){
      var el = $("e" + i), cls = "edge";
      if(s.came[pr[1]] === pr[0] || s.came[pr[0]] === pr[1]) cls += " tree";
      var lv = s.live || s.tree;
      if(lv && ((lv[0] === pr[0] && lv[1] === pr[1]) || (lv[0] === pr[1] && lv[1] === pr[0]))) cls += " live";
      el.setAttribute("class", cls);
    });

    chips($("sq"), s.q, true);
    chips($("ss"), s.seen.slice().sort(), false);
    var ck = Object.keys(s.came).sort();
    $("sc").innerHTML = ck.length
      ? ck.map(function(k){ return '<span class="chip pair">' + k + ' ← <b>' + s.came[k] + '</b></span>'; }).join("")
      : '<span class="empty">비어 있음</span>';

    $("count").textContent = (at + 1) + " / " + steps.length + " 걸음";
    $("step").disabled = (at >= steps.length - 1);
    $("jump").disabled = (at >= steps.length - 1);
    if(at >= 0 && steps[at].done){
      $("verdict").innerHTML = "방문 순서 <b>" + steps[at].order.join(" → ") + "</b>. " +
        (mode === "bfs"
          ? "가까운 것부터 <b>동심원으로</b> 퍼졌습니다 &mdash; 코드 어디에도 「가까운 것부터」라고 안 적혀 있는데요."
          : "한 줄기로 <b>깊이</b> 내려갔다가 되돌아왔습니다. 바꾼 건 <code>popleft()</code> → <code>pop()</code> <b>한 군데</b>뿐입니다.");
    }
  }

  function showGate(g){
    gateOn = g;
    $("gate").classList.add("on");
    $("gmsg").textContent = "";
    $("picks").innerHTML = g.opts.map(function(x){
      return '<button class="pick" data-v="' + x + '">' + x + '</button>';
    }).join("");
  }
  function hideGate(){ gateOn = null; $("gate").classList.remove("on"); }

  function advance(force){
    if(at >= steps.length - 1) return false;
    var nx = steps[at + 1];
    if(!force && nx.ask && $("ask").checked){ showGate(nx.ask); return false; }
    hideGate(); at++; paint(); return true;
  }

  $("step").addEventListener("click", function(){ advance(false); });
  $("jump").addEventListener("click", function(){
    // 다음 「꺼내기」 직전까지 한 번에 간다
    var guard = 0;
    while(guard++ < 400){
      var nx = steps[at + 1];
      if(!nx) break;
      if(nx.ask && $("ask").checked){ showGate(nx.ask); break; }
      hideGate(); at++;
      if(steps[at].line === 5) break;
    }
    paint();
  });
  $("reset").addEventListener("click", function(){ at = -1; hideGate(); paint(); });

  $("picks").addEventListener("click", function(e){
    var b = e.target.closest(".pick"); if(!b || !gateOn) return;
    if(b.dataset.v === gateOn.answer){ advance(true); }
    else {
      b.classList.add("no");
      $("gmsg").innerHTML = mode === "bfs"
        ? "아닙니다. <code>popleft()</code> 는 큐의 <b>앞</b>에서 꺼냅니다 — 먼저 들어간 것이 먼저 나옵니다."
        : "아닙니다. <code>pop()</code> 은 큐의 <b>뒤</b>에서 꺼냅니다 — 나중에 들어간 것이 먼저 나옵니다.";
    }
  });

  function setMode(m){
    mode = m; steps = build(m); at = -1; hideGate();
    $("mBfs").setAttribute("aria-pressed", m === "bfs");
    $("mDfs").setAttribute("aria-pressed", m === "dfs");
    $("verdict").innerHTML = "같은 코드에서 <b>한 글자만</b> 바꿉니다 &mdash; " +
      "<code>popleft()</code> 를 <code>pop()</code> 으로. 그런데 색이 퍼지는 <b>모양이 달라집니다.</b> " +
      "둘을 번갈아 돌려 보세요.";
    drawCode(); paint();
  }
  $("mBfs").addEventListener("click", function(){ setMode("bfs"); });
  $("mDfs").addEventListener("click", function(){ setMode("dfs"); });

  drawFig(); drawCode(); paint();
})();
</script>

</body>
</html>
