<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rx Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --paper:#F5F6F2; --card:#fff; --ink:#17201C; --ink-2:#5D6862; --ink-3:#8A938D;
  --rule:#D5D9D0; --rule-2:#E6E9E2; --pine:#2C5A4B; --pine-soft:#E4EEE9;
  --ok:#2C5A4B; --ok-bg:#E4EEE9; --no:#A8452F; --no-bg:#F9EDE9;
  --code-bg:#1B2420; --code-ink:#DDE4DA; --code-key:#A8D98C; --code-str:#E0C58A; --code-dim:#7C8A82;
  --f-d:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-b:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121714; --card:#1A211D; --ink:#E8EDE8; --ink-2:#A6B0A9; --ink-3:#79837C;
  --rule:#2E3833; --rule-2:#232C28; --pine:#8FCBB2; --pine-soft:#1E2C26;
  --ok:#8FCBB2; --ok-bg:#1E2C26; --no:#E3937D; --no-bg:#2C1E1A;}}
:root[data-theme="dark"]{
  --paper:#121714; --card:#1A211D; --ink:#E8EDE8; --ink-2:#A6B0A9; --ink-3:#79837C;
  --rule:#2E3833; --rule-2:#232C28; --pine:#8FCBB2; --pine-soft:#1E2C26;
  --ok:#8FCBB2; --ok-bg:#1E2C26; --no:#E3937D; --no-bg:#2C1E1A;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:14px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 80px}
.mast{border-bottom:2px solid var(--ink);padding-bottom:12px;display:flex;
  align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.kick{font-family:var(--f-m);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--pine);font-weight:600}
h1{font-family:var(--f-d);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em;margin:6px 0 0}
.sub{color:var(--ink-2);font-size:12.5px;margin:5px 0 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.tab{border:1px solid var(--rule);background:var(--card);color:var(--ink-2);border-radius:999px;
  padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--f-b);white-space:nowrap}
.tab:hover{border-color:var(--pine);color:var(--ink)}
.tab.on{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:600}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:99px;margin-left:6px;vertical-align:middle}
.tab .dot.g{background:var(--ok)} .tab .dot.r{background:var(--no)}
.head2{margin:20px 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.head2 h2{font-family:var(--f-d);font-size:21px;margin:0}
.head2 .n{font-family:var(--f-m);font-size:11px;color:var(--pine);font-weight:600}
.lede{color:var(--ink-2);font-size:12.5px;margin:2px 0 10px}
.trap{background:var(--no-bg);border-left:3px solid var(--no);padding:9px 12px;border-radius:0 6px 6px 0;
  font-size:12.5px;margin:10px 0 14px}
.trap b{color:var(--no)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px}
.q{background:var(--card);border:1px solid var(--rule-2);border-radius:8px;padding:10px 11px 11px}
.q.ok{border-color:var(--ok);background:var(--ok-bg)}
.q.no{border-color:var(--no);background:var(--no-bg)}
.qn{font-family:var(--f-m);font-size:10.5px;color:var(--ink-3);font-weight:600;margin-bottom:6px}
pre{font-family:var(--f-m);font-size:12px;line-height:1.55;background:var(--code-bg);color:var(--code-ink);
  padding:9px 10px;border-radius:6px;margin:0 0 8px;overflow-x:auto;white-space:pre}
pre .k{color:var(--code-key)} pre .s{color:var(--code-str)} pre .c{color:var(--code-dim)}
.expr{font-family:var(--f-m);font-size:13px;background:var(--rule-2);padding:7px 9px;border-radius:6px;margin:0 0 8px}
.txt{font-size:13px;margin:0 0 8px}
.row{display:flex;align-items:center;gap:8px}
.row span{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
input{flex:1;min-width:0;font-family:var(--f-m);font-size:13px;padding:5px 8px;border:1px solid var(--rule);
  border-radius:5px;background:var(--paper);color:var(--ink)}
input:focus{outline:2px solid var(--pine);outline-offset:-1px}
.fb{font-size:11.5px;margin-top:6px;min-height:0}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.bar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule);
  padding:12px 0 14px;margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font-family:var(--f-b);font-size:13px;font-weight:600;padding:8px 16px;border-radius:7px;
  border:1px solid var(--pine);background:var(--pine);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--pine)}
button:hover{filter:brightness(1.08)}
.report{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin:16px 0}
.report h3{font-family:var(--f-d);font-size:16px;margin:0 0 10px}
.mrow{display:grid;grid-template-columns:130px 1fr 54px;gap:9px;align-items:center;margin:5px 0;font-size:12.5px}
.mbar{height:9px;background:var(--rule-2);border-radius:99px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.mrow.weak .mbar i{background:var(--no)}
.mrow.weak b{color:var(--no)}
.rx{margin-top:12px;padding-top:11px;border-top:1px solid var(--rule-2);font-size:13px}
.pill{display:inline-block;border:1px solid var(--pine);color:var(--pine);border-radius:999px;
  padding:3px 11px;font-size:12px;margin:4px 5px 0 0;cursor:pointer;background:transparent}
.pill:hover{background:var(--pine);color:#fff}
.note{color:var(--ink-3);font-size:11.5px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="mast">
  <div>
    <div class="kick">Conditionals &amp; Loops 1</div>
    <h1>Rx Console</h1>
    <p class="sub">Practice 에 쓴 답을 옮겨 적고 채점합니다. 약한 유형에는 추가 문제가 나옵니다.</p>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div id="pane"></div>

<div class="bar">
  <button onclick="grade()">이 유형 채점</button>
  <button class="ghost" onclick="gradeAll()">전체 채점하고 처방받기</button>
  <button class="ghost" onclick="clearAll()">지우기</button>
  <span id="hint" style="font-size:12px;color:var(--ink-3)"></span>
</div>

<div id="report"></div>
</div>

<script>
var DATA = {"bank": [{"t": 1, "title": "출력 결과 쓰기", "kind": "code", "trap": "조건이 거짓이면 아무것도 출력되지 않을 수도 있습니다. 빈칸이 답일 때가 있습니다.", "note": "들여쓰기가 어디까지인지부터 봅니다.", "items": [{"n": "1-1", "code": ["x = 7", "if x > 5:", "    print('큼')", "else:", "    print('작음')"], "a": ["큼"], "out": "큼"}, {"n": "1-2", "code": ["x = 3", "if x > 5:", "    print('큼')", "else:", "    print('작음')"], "a": ["작음"], "out": "작음"}, {"n": "1-3", "code": ["x = 1", "if x > 5:", "    print('큼')", "    print('끝')"], "a": ["없음", "아무것도", "출력없음", "", "-", "없다"], "out": ""}, {"n": "1-4", "code": ["s = 'python'", "if s == 'Python':", "    print('같다')", "else:", "    print('다르다')"], "a": ["다르다"], "out": "다르다"}, {"n": "1-5", "code": ["x = '5'", "if x == 5:", "    print('같다')", "else:", "    print('다르다')"], "a": ["다르다"], "out": "다르다"}, {"n": "1-6", "code": ["n = 8", "if n % 2 == 0:", "    print('짝')", "else:", "    print('홀')"], "a": ["짝"], "out": "짝"}, {"n": "1-7", "code": ["n = 0", "if n % 2 == 0:", "    print('짝')", "else:", "    print('홀')"], "a": ["짝"], "out": "짝"}]}, {"t": 2, "title": "경계값", "kind": "code", "trap": "이상 · 이하 · 초과 · 미만이 나오면 딱 걸치는 값을 넣어 확인하세요. 이상 >= · 이하 <= · 초과 > · 미만 <", "note": "", "items": [{"n": "2-1", "code": ["age = 19", "if age >= 19:", "    print('입장')", "else:", "    print('불가')"], "a": ["입장"], "out": "입장"}, {"n": "2-2", "code": ["s = 60", "if s < 60:", "    print('불합격')", "else:", "    print('합격')"], "a": ["합격"], "out": "합격"}, {"n": "2-3", "code": ["n = 30", "if n < 30:", "    print('입장')", "else:", "    print('정원 초과')"], "a": ["정원 초과"], "out": "정원 초과"}, {"n": "2-4", "code": ["x = 20", "if 10 < x < 20:", "    print('안')", "else:", "    print('밖')"], "a": ["밖"], "out": "밖"}]}, {"t": 3, "title": "elif 순서와 if 나열", "kind": "code", "trap": "elif는 위에서부터 걸러내는 체입니다. 첫 참에서 끝납니다. elif 대신 if를 나열하면 여러 개가 동시에 출력됩니다.", "note": "", "items": [{"n": "3-1", "code": ["s = 85", "if s >= 90: print('A')", "elif s >= 80: print('B')", "elif s >= 70: print('C')", "else: print('D')"], "a": ["B"], "out": "B"}, {"n": "3-2", "code": ["s = 85", "if s >= 90: print('A')", "if s >= 80: print('B')", "if s >= 70: print('C')"], "a": ["B\nC", "B C", "BC"], "out": "B\nC"}, {"n": "3-3", "code": ["x = 7", "if x > 10: print('A')", "elif x > 5: print('B')", "elif x > 3: print('C')", "else: print('D')"], "a": ["B"], "out": "B"}, {"n": "3-4", "code": ["x = 7", "if x > 3: print('C')", "elif x > 5: print('B')", "elif x > 10: print('A')", "else: print('D')"], "a": ["C"], "out": "C"}, {"n": "3-5", "code": ["n = 15", "if n % 3 == 0: print('3의 배수')", "if n % 5 == 0: print('5의 배수')"], "a": ["3의 배수\n5의 배수", "3의 배수 5의 배수", "3의 배수5의 배수"], "out": "3의 배수\n5의 배수"}, {"n": "3-6", "code": ["n = 15", "if n % 3 == 0: print('3의 배수')", "elif n % 5 == 0: print('5의 배수')"], "a": ["3의 배수"], "out": "3의 배수"}]}, {"t": 4, "title": "and / or / not", "kind": "code", "trap": "일상어 \"커피 또는 차\"는 하나만 주지만, 파이썬 or는 둘 다여도 참입니다.", "note": "", "items": [{"n": "4-1", "code": ["x = 10", "if x > 5 and x < 8: print('A')", "else: print('B')"], "a": ["B"], "out": "B"}, {"n": "4-2", "code": ["a, b = True, False", "if a and b: print('둘 다')", "elif a or b: print('하나')", "else: print('없음')"], "a": ["하나"], "out": "하나"}, {"n": "4-3", "code": ["t, h = 25, 80", "if t > 30 and h > 70: print('불쾌')", "elif t > 30 or h > 70: print('주의')", "else: print('쾌적')"], "a": ["주의"], "out": "주의"}, {"n": "4-4", "code": ["x = 4", "if not (x > 5): print('A')", "else: print('B')"], "a": ["A"], "out": "A"}, {"n": "4-5", "code": ["n = 6", "if n%2==0 and n%3==0: print('둘 다')", "else: print('아님')"], "a": ["둘 다"], "out": "둘 다"}, {"n": "4-6", "code": ["n = 4", "if n%2==0 and n%3==0: print('둘 다')", "else: print('아님')"], "a": ["아님"], "out": "아님"}, {"n": "4-7", "code": ["n = 4", "if n%2==0 or n%3==0: print('둘 다')", "else: print('아님')"], "a": ["둘 다"], "out": "둘 다"}]}, {"t": 5, "title": "참 · 거짓 판정", "kind": "tf", "trap": "x = 7, y = 3 일 때 각 조건식이 참인지 거짓인지. T 또는 F.", "note": "연쇄 비교 a > b > c 는 a > b and b > c 와 같습니다.", "items": [{"n": "5-1", "expr": "x > y", "a": ["T"]},   s = s.replace(/\s+/g, "");

}
function hit(val, list){

    if (v === a) return true;
  }
  return false;
}
function sec(t){ for (var i=0;i<BANK.length;i++) if (BANK[i].t===t) return BANK[i]; }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hl(lines){
  var out = lines.map(function(l){
    var s = esc(l);
    s = s.replace(/\b(if|elif|else|and|or|not|in|for|print|int|input)\b/g, '<span class="k">$1</span>');
    s = s.replace(/(&#39;|')([^']*)(&#39;|')/g, '<span class="s">\'$2\'</span>');
    s = s.replace(/(#.*)$/, '<span class="c">$1</span>');
    return s;
  });
  return out.join("\n");
}

function tabs(){
  var h = "";
  for (var i=0;i<BANK.length;i++){
    var b = BANK[i], k = "b"+b.t, st = store[k];
    var dot = "";
    if (st && st.done) dot = '<span class="dot ' + (st.weak ? "r" : "g") + '"></span>';
    h += '<button class="tab' + (b.t===cur && mode==="bank" ? " on":"") + '" onclick="go(' + b.t + ',\'bank\')">유형 ' + b.t + dot + '</button>';
  }
  h += '<button class="tab' + (mode==="extra" ? " on":"") + '" onclick="goExtra(' + cur + ')" style="border-style:dashed">추가 문제</button>';
  $("tabs").innerHTML = h;
}

function render(){
  var b = sec(cur), items, title, lede, trap, note, key;
  if (mode === "extra"){
    items = EXTRA[String(cur)] || [];
    title = "유형 " + cur + " 추가 문제";
    lede  = b.title + " — 같은 유형을 한 번 더 돕니다.";
    trap  = ""; note = b.note || ""; key = "x"+cur;
    if (cur === 5) lede = "참 · 거짓 판정 — 이번에는 x = 4, y = 9 입니다.";
  } else {
    items = b.items; title = "유형 " + cur + "  " + b.title;
    lede = ""; trap = b.trap; note = b.note || ""; key = "b"+cur;
  }
  var h = '<div class="head2"><span class="n">' + (mode==="extra" ? "EXTRA" : "TYPE " + cur) + '</span><h2>' + title + '</h2></div>';
  if (lede) h += '<p class="lede">' + lede + '</p>';
  if (trap) h += '<div class="trap"><b>함정</b> ' + trap + '</div>';
  if (!items.length){
    h += '<p class="lede">이 유형은 종이에서 코드를 직접 씁니다. 화면 채점은 없습니다.</p>';
    $("pane").innerHTML = h; return;
  }
  h += '<div class="grid">';
  for (var i=0;i<items.length;i++){
    var it = items[i], id = key + "-" + i;
    h += '<div class="q" id="q' + id + '"><div class="qn">' + it.n + '</div>';
    if (it.code) h += '<pre>' + hl(it.code) + '</pre>';
    else if (it.expr) h += '<div class="expr">' + esc(it.expr) + '</div>';
    else if (it.txt) h += '<div class="txt">' + esc(it.txt) + (it.sub ? ' <span style="color:var(--ink-3)">— ' + esc(it.sub) + '</span>' : '') + '</div>';
    if (it.goal) h += '<div class="txt" style="color:var(--ink-3);font-size:12px">목표 — ' + esc(it.goal) + '</div>';
    var lab = "출력";
    if (b.kind === "tf" || (mode==="extra" && cur===5)) lab = "T / F";
    else if (b.kind === "expr" || (mode==="extra" && cur===6)) lab = "조건식";
    else if (b.kind === "blank") lab = "빈칸";
    else if (b.kind === "errline") lab = "줄번호";
    else if (b.kind === "fix") lab = "지금 답";
    else if (b.kind === "write") lab = "경우의 수";
    h += '<div class="row"><span>' + lab + '</span><input id="in' + id + '" autocomplete="off"></div>';
    h += '<div class="fb" id="fb' + id + '"></div></div>';
  }
  h += '</div>';
  $("pane").innerHTML = h;
  var st = store[key];
  if (st && st.vals) for (var j=0;j<st.vals.length;j++){ var e = $("in"+key+"-"+j); if (e) e.value = st.vals[j]; }
  $("hint").textContent = "";
  window.scrollTo(0,0);
}

function go(t, m){ cur = t; mode = m || "bank"; tabs(); render(); }
function goExtra(t){ if (!EXTRA[String(t)]) { $("hint").textContent = "유형 " + t + " 은 추가 문제가 없습니다."; return; } cur = t; mode = "extra"; tabs(); render(); }

function items(){
  if (mode === "extra") return EXTRA[String(cur)] || [];
  return sec(cur).items;
}
function keyOf(){ return (mode === "extra" ? "x" : "b") + cur; }

function grade(){
  var its = items(), key = keyOf(), right = 0, vals = [];
  if (!its.length) return;
  for (var i=0;i<its.length;i++){
    var id = key + "-" + i, el = $("in"+id), v = el ? el.value : "";
    vals.push(v);
    var ok = hit(v, its[i].a);
    if (ok) right++;
    var card = $("q"+id), fb = $("fb"+id);
    card.className = "q " + (ok ? "ok" : "no");
    if (ok) { fb.className = "fb ok"; fb.textContent = "맞음"; }
    else {
      fb.className = "fb no";
      var ans = its[i].a[0] === "" ? "없음" : its[i].a[0];
      fb.textContent = "답 " + ans + (its[i].why ? " — " + its[i].why : "") + (its[i].fix ? " → " + its[i].fix : "");
    }
  }
  var rate = right / its.length;
  store[key] = { done:true, right:right, total:its.length, weak:(rate < 0.8), vals:vals };
  $("hint").textContent = its.length + "문항 중 " + right + "개 맞음";
  tabs();
}

function gradeAll(){
  grade();
  var rows = [], weak = [];
  for (var i=0;i<BANK.length;i++){
    var b = BANK[i], st = store["b"+b.t];
    if (!st || !st.done) continue;
    rows.push({ t:b.t, title:b.title, right:st.right, total:st.total });
    if (st.weak) weak.push(b.t);
  }
  if (!rows.length){ $("report").innerHTML = '<div class="report"><h3>아직 채점한 유형이 없습니다</h3><p class="lede">유형을 하나 골라 답을 넣고 「이 유형 채점」을 누르세요.</p></div>'; return; }
  var h = '<div class="report"><h3>진단</h3>';
  for (var j=0;j<rows.length;j++){
    var r = rows[j], pct = Math.round(r.right / r.total * 100);
    h += '<div class="mrow' + (pct < 80 ? " weak" : "") + '"><b>유형 ' + r.t + ' ' + r.title + '</b>' +
         '<div class="mbar"><i style="width:' + pct + '%"></i></div>' +
         '<span>' + r.right + '/' + r.total + '</span></div>';
  }
  h += '<div class="rx"><b>처방</b> — ';
  if (!weak.length) h += '약한 유형이 없습니다. 유형 11 완성 문제로 넘어가세요.';
  else {
    h += '아래 유형을 한 번 더 도세요. 눌러서 바로 시작합니다.<br>';
    for (var k=0;k<weak.length;k++){
      var b2 = sec(weak[k]);
      h += '<button class="pill" onclick="goExtra(' + weak[k] + ')">유형 ' + weak[k] + ' ' + b2.title + '</button>';
    }
  }
  h += '</div><p class="note">80% 미만인 유형을 약하다고 봅니다. 채점하지 않은 유형은 표에 나오지 않습니다.</p></div>';
  $("report").innerHTML = h;
  $("report").scrollIntoView({behavior:"smooth", block:"start"});
}

function clearAll(){
  var its = items(), key = keyOf();
  for (var i=0;i<its.length;i++){
    var id = key + "-" + i;
    if ($("in"+id)) $("in"+id).value = "";
    if ($("q"+id)) $("q"+id).className = "q";
    if ($("fb"+id)) $("fb"+id).textContent = "";
  }
  delete store[key]; $("hint").textContent = ""; tabs();
}

document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target.tagName === "INPUT"){
    var all = document.querySelectorAll("#pane input");
    for (var i=0;i<all.length;i++) if (all[i] === e.target && all[i+1]) { all[i+1].focus(); return; }
    grade();
  }
});

tabs(); render();
</script>
</body>
</html>
